<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CultRemix · Screens</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #0a0a0a; --muted: #6f6f6f; --line: #e7e7e7; --soft: #f5f5f3; --bad: #c8102e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, a { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  .app { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100vh; }

  aside { display: flex; flex-direction: column; min-height: 0; border-right: 2px solid var(--ink); background: #fff; }
  .head { padding: 22px 22px 16px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 900; letter-spacing: .24em; font-size: 13px; }
  .brand span { letter-spacing: .08em; font-weight: 700; color: var(--muted); }
  .run { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  .seg { display: inline-flex; margin-top: 14px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .seg button { padding: 5px 12px; font-size: 12px; font-weight: 800; letter-spacing: .02em; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .list { overflow-y: auto; padding: 8px 12px 40px; flex: 1; }
  .group { margin-top: 16px; }
  .group h3 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin: 0 10px 6px; color: var(--muted); }
  .item { display: grid; grid-template-columns: 26px 1fr; gap: 4px 6px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 12px; }
  .item:hover { background: var(--soft); }
  .item[aria-current="true"] { background: var(--ink); color: #fff; }
  .item .n { font-family: ui-monospace, Menlo, monospace; font-size: 11px; opacity: .5; padding-top: 3px; }
  .item .t { font-weight: 750; font-size: 14px; line-height: 1.3; display: flex; gap: 6px; align-items: center; }
  .item .d { grid-column: 2; font-size: 12.5px; line-height: 1.4; opacity: .62; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bad { font-size: 10px; font-weight: 800; color: #fff; background: var(--bad); border-radius: 6px; padding: 1px 6px; letter-spacing: .04em; }
  .foot { padding: 12px 22px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; line-height: 1.6; }
  kbd { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; border: 1px solid #ccc; border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink); }

  main { min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .bar { position: sticky; top: 0; z-index: 3; background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 14px; padding: 16px 32px 14px; border-bottom: 2px solid var(--ink); }
  .menu { display: none; border: 2px solid var(--ink); border-radius: 10px; padding: 4px 10px; font-weight: 800; }
  .crumb { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .bar h1 { margin: 2px 0 0; font-size: 30px; font-weight: 900; letter-spacing: -.025em; line-height: 1.05; }
  .spacer { flex: 1; }
  .count { font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: nowrap; color: var(--muted); }
  .nav { border: 2px solid var(--ink); border-radius: 12px; width: 44px; height: 40px; font-weight: 900; font-size: 18px; }
  .nav:hover:not(:disabled) { background: var(--ink); color: #fff; }
  .nav:disabled { opacity: .2; cursor: default; }
  .body { padding: 22px 32px 80px; }
  .desc { max-width: 820px; font-size: 18px; line-height: 1.55; margin: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 22px; font-size: 13px; }
  .chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; text-decoration: none; }
  a.chip:hover { border-color: var(--ink); }
  .error { color: var(--bad); font-weight: 700; font-size: 14px; margin: 0 0 18px; }
  .stage { display: flex; gap: 28px; align-items: flex-start; }
  .frame { margin: 0; flex: none; }
  .frame figcaption { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
  .frame img { display: block; height: auto; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.08); background: var(--soft); cursor: zoom-in; }
  .frame.desktop { flex: 1; min-width: 0; }
  .frame.desktop img { width: 100%; max-width: 1440px; }
  .frame.phone img { width: 390px; max-width: 100%; border-radius: 26px; }
  .empty { color: var(--muted); font-size: 14px; }

  .grid { display: none; padding: 26px 32px 80px; }
  .grid section { margin-bottom: 34px; }
  .grid h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
  .card { text-align: left; }
  .card img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; display: block; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
  .card:hover img { border-color: var(--ink); }
  .card .t { margin-top: 8px; font-weight: 750; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
  .card .t .n { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  body.gridmode .single { display: none; } body.gridmode .grid { display: block; }

  .scrim { display: none; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(86vw, 340px); z-index: 10; transform: translateX(-102%); transition: transform .2s ease; }
    body.drawer aside { transform: none; }
    body.drawer .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; }
    .menu { display: inline-block; }
    .bar { padding: 12px 14px; gap: 10px; flex-wrap: wrap; }
    .bar h1 { font-size: 22px; }
    .titlebox { order: 5; flex-basis: 100%; }
    .body, .grid { padding: 16px 14px 60px; }
    .desc { font-size: 16px; }
    .stage { flex-direction: column; }
    .frame.phone img { width: 100%; }
  }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside>
    <div class="head">
      <div class="brand">CULTREMIX <span>· SCREENS</span></div>
      <div class="run" id="run"></div>
      <div class="seg" role="group" aria-label="Show">
        <button data-view="both" aria-pressed="true">Both</button>
        <button data-view="desktop" aria-pressed="false">Desktop</button>
        <button data-view="phone" aria-pressed="false">Phone</button>
        <button data-view="grid" aria-pressed="false">All</button>
      </div>
    </div>
    <nav class="list" id="list"></nav>
    <div class="foot"><kbd>←</kbd> <kbd>→</kbd> step &nbsp; <kbd>1</kbd> both <kbd>2</kbd> desktop <kbd>3</kbd> phone &nbsp; <kbd>G</kbd> all screens. On a phone, swipe.</div>
  </aside>
  <main id="main">
    <div class="bar">
      <button class="menu" id="menu" aria-label="Screens">☰</button>
      <div class="titlebox"><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
      <button class="nav" id="prev" aria-label="Previous screen">←</button>
      <button class="nav" id="next" aria-label="Next screen">→</button>
    </div>
    <div class="single body">
      <p class="desc" id="desc"></p>
      <div class="meta" id="meta"></div>
      <p class="error" id="error" hidden></p>
      <div class="stage" id="stage"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<script src="manifest.js"></script>
<script>
(() => {
  const data = window.SCREENS || { screens: [] };
  // Viewed over the tailnet, page links go to the dev server's tailnet address (same port).
  if (data.base && /\.ts\.net$/.test(location.hostname)) {
    data.base = data.base.replace(/^http:\/\/(localhost|127\.0\.0\.1)/, "https://" + location.hostname);
  }
  const screens = data.screens;
  const $ = (id) => document.getElementById(id);
  let index = 0;
  let view = localStorage.getItem("screens-view") || "both";

  const when = data.capturedAt ? new Date(data.capturedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
  const failed = screens.filter((s) => s.error).length;
  $("run").textContent = screens.length + " screens from " + (data.base || "dev") + (when ? " · " + when : "") + (failed ? " · " + failed + " didn't capture" : "");

  const groups = [];
  screens.forEach((s, i) => {
    let g = groups.find((x) => x.name === s.group);
    if (!g) groups.push((g = { name: s.group, items: [] }));
    g.items.push(i);
  });

  const list = $("list");
  for (const g of groups) {
    const box = document.createElement("div");
    box.className = "group";
    box.innerHTML = "<h3></h3>";
    box.querySelector("h3").textContent = g.name;
    for (const i of g.items) {
      const s = screens[i];
      const b = document.createElement("button");
      b.className = "item";
      b.dataset.i = i;
      b.innerHTML = '<span class="n"></span><span class="t"></span><span class="d"></span>';
      b.querySelector(".n").textContent = String(i + 1).padStart(2, "0");
      b.querySelector(".t").textContent = s.title;
      if (s.error) b.querySelector(".t").insertAdjacentHTML("beforeend", '<span class="bad">FAILED</span>');
      b.querySelector(".d").textContent = s.description;
      b.onclick = () => { show(i); document.body.classList.remove("drawer"); };
      box.appendChild(b);
    }
    list.appendChild(box);
  }

  const grid = $("grid");
  for (const g of groups) {
    const sec = document.createElement("section");
    sec.innerHTML = "<h2></h2><div class='cards'></div>";
    sec.querySelector("h2").textContent = g.name;
    for (const i of g.items) {
      const s = screens[i];
      const c = document.createElement("button");
      c.className = "card";
      const src = s.thumb || s.shots.desktop || s.shots.phone;
      c.innerHTML = (src ? '<img loading="lazy" alt="">' : '<div class="empty">No picture</div>') + '<div class="t"><span class="n"></span><span class="x"></span></div>';
      if (src) c.querySelector("img").src = src;
      c.querySelector(".n").textContent = String(i + 1).padStart(2, "0");
      c.querySelector(".x").textContent = s.title;
      c.onclick = () => { setView(localStorage.getItem("screens-last-view") || "both"); show(i); };
      sec.querySelector(".cards").appendChild(c);
    }
    grid.appendChild(sec);
  }

  function frame(kind, src) {
    const f = document.createElement("figure");
    f.className = "frame " + kind;
    f.innerHTML = "<figcaption></figcaption><a target='_blank' rel='noopener'><img alt=''></a>";
    f.querySelector("figcaption").textContent = kind === "desktop" ? "Desktop · 1440 px" : "Phone · 390 px";
    f.querySelector("a").href = src;
    f.querySelector("img").src = src;
    return f;
  }

  function show(i) {
    if (!screens.length) { $("title").textContent = "No screens yet"; $("desc").textContent = "Run bun run screens to capture them."; return; }
    index = Math.max(0, Math.min(screens.length - 1, i));
    const s = screens[index];
    $("crumb").textContent = s.group;
    $("title").textContent = s.title;
    $("desc").textContent = s.description;
    $("count").textContent = (index + 1) + " / " + screens.length;
    $("prev").disabled = index === 0;
    $("next").disabled = index === screens.length - 1;
    const meta = $("meta");
    meta.innerHTML = "";
    const path = document.createElement(s.path && s.path.startsWith("/") && !s.path.includes(" ") ? "a" : "span");
    path.className = "chip";
    path.textContent = s.path || "";
    if (path.tagName === "A") { path.href = (data.base || "") + s.path; path.target = "_blank"; path.rel = "noopener"; path.title = "Open this page"; }
    if (s.path) meta.appendChild(path);
    $("error").hidden = !s.error;
    $("error").textContent = s.error ? "This screen didn't capture: " + s.error : "";
    const stage = $("stage");
    stage.innerHTML = "";
    const want = view === "grid" ? "both" : view;
    if ((want === "both" || want === "desktop") && s.shots.desktop) stage.appendChild(frame("desktop", s.shots.desktop));
    if ((want === "both" || want === "phone") && s.shots.phone) stage.appendChild(frame("phone", s.shots.phone));
    if (!stage.children.length) stage.innerHTML = '<p class="empty">No picture for this view.</p>';
    document.querySelectorAll(".item").forEach((b) => b.setAttribute("aria-current", String(Number(b.dataset.i) === index)));
    document.querySelector('.item[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
    if (location.hash !== "#" + s.id) history.replaceState(null, "", "#" + s.id);
    $("main").scrollTo({ top: 0 });
    // Load the next screen's pictures ahead.
    const next = screens[index + 1];
    if (next) Object.values(next.shots).forEach((src) => { const im = new Image(); im.src = src; });
  }

  function setView(v) {
    view = v;
    if (v !== "grid") localStorage.setItem("screens-last-view", v);
    localStorage.setItem("screens-view", v);
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    document.body.classList.toggle("gridmode", v === "grid");
    if (v !== "grid") show(index);
  }

  document.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => setView(b.dataset.view)));
  $("prev").onclick = () => show(index - 1);
  $("next").onclick = () => show(index + 1);
  $("menu").onclick = () => document.body.classList.toggle("drawer");
  $("scrim").onclick = () => document.body.classList.remove("drawer");
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" || e.key === "j") { if (view === "grid") setView(localStorage.getItem("screens-last-view") || "both"); show(index + 1); }
    else if (e.key === "ArrowLeft" || e.key === "k") { if (view === "grid") setView(localStorage.getItem("screens-last-view") || "both"); show(index - 1); }
    else if (e.key === "1") setView("both");
    else if (e.key === "2") setView("desktop");
    else if (e.key === "3") setView("phone");
    else if (e.key === "g" || e.key === "G") setView(view === "grid" ? (localStorage.getItem("screens-last-view") || "both") : "grid");
  });
  let touchX = null;
  $("main").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  $("main").addEventListener("touchend", (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 70) show(index + (dx < 0 ? 1 : -1));
    touchX = null;
  });

  const fromHash = screens.findIndex((s) => "#" + s.id === location.hash);
  show(fromHash >= 0 ? fromHash : 0);
  setView(view);
})();
</script>
</body>
</html>
